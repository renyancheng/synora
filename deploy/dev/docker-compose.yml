name: synora-dev

x-api-common: &api-common
  image: synora-api:dev
  build:
    context: ../../services/api
    args:
      BASE_IMAGE: ${SYNORA_API_BASE_IMAGE:-docker.1ms.run/library/python:3.12-slim-bookworm}
      PIP_INDEX_URL: ${SYNORA_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
      PIP_TRUSTED_HOST: ${SYNORA_PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
      PIP_TIMEOUT: ${SYNORA_PIP_TIMEOUT:-120}
  pull_policy: build
  env_file:
    - .env
  environment:
    SYNORA_DATABASE_URL: ${SYNORA_DATABASE_URL:-postgresql+psycopg://synora:synora@postgres:5432/synora}
    SYNORA_CELERY_BROKER_URL: ${SYNORA_CELERY_BROKER_URL:-redis://redis:6379/0}
    SYNORA_CELERY_RESULT_BACKEND: ${SYNORA_CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    SYNORA_MINIO_ENDPOINT: ${SYNORA_MINIO_ENDPOINT:-minio:9000}
    SYNORA_MINIO_ACCESS_KEY: ${SYNORA_MINIO_ACCESS_KEY:-synora}
    SYNORA_MINIO_SECRET_KEY: ${SYNORA_MINIO_SECRET_KEY:-synora123}
    SYNORA_SMTP_HOST: ${SYNORA_SMTP_HOST:-mailhog}
    SYNORA_SMTP_PORT: ${SYNORA_SMTP_PORT:-1025}
    SYNORA_SMTP_USERNAME: ${SYNORA_SMTP_USERNAME:-}
    SYNORA_SMTP_PASSWORD: ${SYNORA_SMTP_PASSWORD:-}
    SYNORA_SMTP_USE_TLS: ${SYNORA_SMTP_USE_TLS:-false}
    SYNORA_NOTIFICATION_FROM_EMAIL: ${SYNORA_NOTIFICATION_FROM_EMAIL:-synora@example.com}
    SYNORA_NOTIFICATION_TO_EMAIL: ${SYNORA_NOTIFICATION_TO_EMAIL:-han.teacher@example.com}
    SYNORA_MCP_BEARER_TOKEN: ${SYNORA_MCP_BEARER_TOKEN:-local-dev-token}
    SYNORA_MCP_MOUNT_PATH: ${SYNORA_MCP_MOUNT_PATH:-/mcp}
    SYNORA_LANGGRAPH_CHECKPOINT_BACKEND: ${SYNORA_LANGGRAPH_CHECKPOINT_BACKEND:-postgres}
    SYNORA_LANGGRAPH_CHECKPOINT_DB_URL: ${SYNORA_LANGGRAPH_CHECKPOINT_DB_URL:-postgresql+psycopg://synora:synora@postgres:5432/synora}
    SYNORA_LANGGRAPH_CHECKPOINT_SQLITE_PATH: ${SYNORA_LANGGRAPH_CHECKPOINT_SQLITE_PATH:-langgraph_checkpoints.db}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
    mailhog:
      condition: service_started

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: synora
      POSTGRES_USER: synora
      POSTGRES_PASSWORD: synora
    ports:
      - "5432:5432"
    volumes:
      - synora-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synora -d synora"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.1ms.run/library/redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: docker.1ms.run/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SYNORA_MINIO_ACCESS_KEY:-synora}
      MINIO_ROOT_PASSWORD: ${SYNORA_MINIO_SECRET_KEY:-synora123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - synora-dev-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: docker.1ms.run/mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    <<: *api-common
    ports:
      - "8000:8000"

  worker:
    <<: *api-common
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info

  beat:
    <<: *api-common
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info

volumes:
  synora-dev-postgres:
  synora-dev-minio:
