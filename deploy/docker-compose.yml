services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: synora
      POSTGRES_USER: synora
      POSTGRES_PASSWORD: synora
    ports:
      - "5432:5432"
    volumes:
      - synora-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ../services/api
    env_file:
      - .env.example
    environment:
      SYNORA_DATABASE_URL: postgresql+psycopg://synora:synora@postgres:5432/synora
      SYNORA_CELERY_BROKER_URL: redis://redis:6379/0
      SYNORA_CELERY_RESULT_BACKEND: redis://redis:6379/1
      SYNORA_SMTP_HOST: mailhog
      SYNORA_SMTP_PORT: 1025
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - mailhog

  worker:
    build:
      context: ../services/api
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info
    env_file:
      - .env.example
    environment:
      SYNORA_DATABASE_URL: postgresql+psycopg://synora:synora@postgres:5432/synora
      SYNORA_CELERY_BROKER_URL: redis://redis:6379/0
      SYNORA_CELERY_RESULT_BACKEND: redis://redis:6379/1
      SYNORA_SMTP_HOST: mailhog
      SYNORA_SMTP_PORT: 1025
    depends_on:
      - postgres
      - redis
      - mailhog

  beat:
    build:
      context: ../services/api
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    env_file:
      - .env.example
    environment:
      SYNORA_DATABASE_URL: postgresql+psycopg://synora:synora@postgres:5432/synora
      SYNORA_CELERY_BROKER_URL: redis://redis:6379/0
      SYNORA_CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - postgres
      - redis

volumes:
  synora-postgres:
