name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Flutter Android Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/synora

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      # google-services.json 不入库（含 Firebase API key，见 app/synora/.gitignore），
      # 从 repo secret GOOGLE_SERVICES_JSON（base64）解码注入，供 google-services 插件使用。
      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::缺少 GOOGLE_SERVICES_JSON secret，请在仓库 Settings → Secrets and variables → Actions 配置（google-services.json 的 base64 编码）。"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json || { echo "::error::解码后的 google-services.json 为空"; exit 1; }

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: synora-android-release-apk
          path: app/synora/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
