name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Flutter Android Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/synora

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: synora-android-release-apk
          path: app/synora/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
